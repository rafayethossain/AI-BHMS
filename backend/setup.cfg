[flake8]
max-line-length = 120
exclude = .git,__pycache__,build,dist

[isort]
profile = black
known_first_party = apps,config
known_third_party = rest_framework,django

[tool.ruff]
line-length = 120
target-version = py311
select = E,F,W,I
ignore = E501

[tool.ruff.isort]
known-first-party = ["apps", "config"]
